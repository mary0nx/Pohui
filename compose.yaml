# Family OS — production-style stack for a single VPS.
# Only Caddy publishes ports; PostgreSQL and Redis stay on the internal network.
name: familyos

x-backend: &backend
  build:
    context: ./backend
  image: familyos-backend:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-familyos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-familyos}
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_PATH: /data/files
  restart: unless-stopped
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-familyos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    shm_size: 128mb

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  # Runs once per deploy, before api/bot/worker start: migrations never run concurrently.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - files:/data/files

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/familyos-worker-heartbeat) )) -lt 180"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - files:/data/files

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      disable: true
    profiles: ["bot"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: familyos-web:${IMAGE_TAG:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
  files: {}
  caddy_data: {}
  caddy_config: {}
